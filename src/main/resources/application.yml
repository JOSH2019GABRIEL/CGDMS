#spring.application.name=CGDMS
server:
  tomcat:
    max-threads: 200
    accept-count: 100
  port: 9090
  servlet:
    context-path: /api/v1/


spring:
  application:
    name: CGDMS
  #  profiles:
#    active: prod   # ✅ Correct placement
  web:
    resources:
      static-locations: classpath:/static/
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    url: jdbc:postgresql://localhost:5432/cgdms
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 50MB

  mail:
    host: localhost
    port: 1025
    username: josh
    password: josh
    properties:
      mail:
        smtp:
          trust: "*"
        auth: true
        starttls:
          enable: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000

springdoc:
  default-produce-media-type: application/json

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000
      refresh-token:
        expiration: 604800000
  mailing:
    frontend:
      activation-url: "http://localhost:1300/active-account"



